name: Bug report
description: Something does not work as described.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        All data in CAN is fictional. Never paste real personal data, secrets or evidence here. For a security problem do not open a public issue: follow SECURITY.md.
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Only steps you ran yourself, with fictional data.
    validations:
      required: true
  - type: checkboxes
    id: data
    attributes:
      label: Data check
      options:
        - label: I did not include real personal data or secrets.
          required: true
